[project]
name = "epidote"
version = "0.1.0"
description = "Desktop meeting recorder and transcript assistant for macOS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Epidote" },
]
dependencies = [
  "PySide6>=6.8",
  "httpx>=0.28.1",
  "faster-whisper>=1.1.1",
  "google-api-python-client>=2.179.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.2",
  "numpy>=2.2.0",
  "pyannote.audio>=3.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[project.scripts]
epidote = "epidote.main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
